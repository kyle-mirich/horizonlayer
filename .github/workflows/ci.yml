name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    name: Lint, typecheck, test, coverage, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Enforce coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

  mutation:
    name: Mutation testing (non-blocking report)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: horizonlayer_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d horizonlayer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HORIZONLAYER_INTEGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/horizonlayer_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL integration tests
        run: npm run test:integration:postgres

  retrieval-benchmark:
    name: Real PostgreSQL/Qdrant retrieval benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: horizonlayer_benchmark
          # This database contains only disposable synthetic benchmark records.
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d horizonlayer_benchmark"
          --health-interval 10s --health-timeout 5s --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.18.2-unprivileged
        env:
          QDRANT__TELEMETRY_DISABLED: "true"
        ports:
          - 6333:6333
    env:
      HORIZONLAYER_BENCHMARK_DATABASE_URL: postgres://postgres:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/horizonlayer_benchmark
      HORIZONLAYER_BENCHMARK_QDRANT_URL: http://127.0.0.1:6333
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.benchmark-model-cache
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache pinned local embedding model
        uses: actions/cache@v4
        with:
          path: .benchmark-model-cache
          key: minilm-fp32-aff7a1dc4e8a1ea593e6ea21e95c22ef0a25966f
      - name: Measure real retrieval and lifecycle correctness
        run: npm run benchmark:retrieval -- --backend both --output benchmarks/results/ci-retrieval.json
      - name: Upload benchmark evidence for this exact checkout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evidence-${{ github.sha }}
          path: benchmarks/results/ci-retrieval.json
          if-no-files-found: warn

  packed-recovery:
    name: Packed CLI recovery journey
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HORIZONLAYER_RECOVERY_REPORT: ${{ github.workspace }}/benchmarks/results/ci-recovery.json
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.benchmark-model-cache
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache pinned local embedding model
        uses: actions/cache@v4
        with:
          path: .benchmark-model-cache
          key: minilm-fp32-aff7a1dc4e8a1ea593e6ea21e95c22ef0a25966f
      - name: Prove packed recovery and retain timed evidence
        run: npm run benchmark:recovery
      - name: Upload recovery evidence for this exact checkout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence-${{ github.sha }}
          path: benchmarks/results/ci-recovery.json
          if-no-files-found: warn
